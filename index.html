    const wrapper=document.querySelector('.input-wrapper');
    if(wrapper && !wrapper.querySelector('.elix-ai-disclaimer')) {
        const d=document.createElement('div');
        d.className='elix-ai-disclaimer';
        d.innerHTML='© InOutBio.Os · La IA puede cometer errores. Verifica la información importante. · <button type="button">Acuerdo de uso y licencia</button>';
        d.querySelector('button').onclick=mostrarLegal;
        wrapper.appendChild(d);
    }

    // Panel de cuenta al pie del sidebar.
    const sidebar=document.querySelector('.sidebar');
    if(sidebar && !sidebar.querySelector('.elix-account-panel')) {
        const p=document.createElement('div');
        p.className='elix-account-panel';
        p.innerHTML=`<div id="elix-account-name" class="elix-account-name">Cuenta: comprobando acceso...</div><div class="elix-account-actions"><button type="button" id="elix-manual-btn">Manual de usuario</button><button type="button" id="elix-logout-btn" style="display:none">Cerrar sesión</button></div><div class="elix-account-copyright">© InOutBio.Os</div>`;
        sidebar.appendChild(p);
        p.querySelector('#elix-manual-btn').onclick=mostrarManualUsuario;
    }

    /* =========================================================
       E) FIREBASE AUTH — USUARIO + CONTRASEÑA
       =========================================================
       IMPORTANTE: Firebase Auth nativamente autentica email+password.
       Para ofrecer UX de "usuario + contraseña" sin Google, Elix transforma
       internamente el username en username@elix.local. No se expone al usuario.
       ========================================================= */
    const ELIX_FIREBASE_CONFIG = {
        apiKey: "AIzaSyC9C8xG_2j8m9ud4N_dZTlW_IpNGSObMag",
        authDomain: "simulador-sql-1.firebaseapp.com",
        projectId: "simulador-sql-1",
        storageBucket: "simulador-sql-1.firebasestorage.app",
        messagingSenderId: "716599040841",
        appId: "1:716599040841:web:1909dbb878589483b75898"
    };
    const ELIX_AUTH_REQUIRED = true;
    const ELIX_LICENSE_VERSION = '2.0';
    const ELIX_LICENSE_PENDING_KEY = 'elixLicenseAcceptancePending';
    const ELIX_LAST_USER_KEY = 'elixLastUser';

    function elixLicenseKey(uid){ return `elixLicense:${String(uid||'anon')}:${ELIX_LICENSE_VERSION}`; }
    function elixLicenciaAceptada(uid){ return localStorage.getItem(elixLicenseKey(uid))==='1'; }
    function elixGuardarLicencia(uid){ if(uid) localStorage.setItem(elixLicenseKey(uid),'1'); }

    function firebaseConfigLista(){
        return Object.values(ELIX_FIREBASE_CONFIG).every(v=>String(v||'').trim().length>0);
    }
    function normalizarCredencial(valor){
        return String(valor||'').trim().toLowerCase();
    }
    function esEmailValido(valor){
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizarCredencial(valor));
    }
    function validarCredencial(valor){
        const v=normalizarCredencial(valor);
        return esEmailValido(v) || /^[a-z0-9._-]{3,32}$/.test(v);
    }
    function credencialAEmail(valor){
        const v=normalizarCredencial(valor);
        return esEmailValido(v) ? v : `${v}@elix.local`;
    }
    function nombreUsuarioFirebase(currentUser){
        if(currentUser?.displayName) return currentUser.displayName;
        const email=String(currentUser?.email||'');
        return email.endsWith('@elix.local') ? email.slice(0,-'@elix.local'.length) : email;
    }

    function crearAuthOverlay(){
        const existente=document.getElementById('elix-auth-overlay');
        if(existente) return existente;

        const o=document.createElement('div');
        // Se abre desde el primer instante: la app permanece bloqueada hasta validar Firebase.
        o.className='elix-auth-overlay open';
        o.id='elix-auth-overlay';
        o.innerHTML=`<div class="elix-auth-card" role="dialog" aria-modal="true" aria-labelledby="elix-auth-title">
            <div class="elix-auth-logo" id="elix-auth-title">🧬 Elix AI</div>
            <div class="elix-auth-sub" id="elix-auth-sub">Acceso seguro a Elix AI · © InOutBio.Os</div>
            <form id="elix-auth-form" novalidate>
                <label for="elix-auth-user">Usuario</label>
                <input id="elix-auth-user" type="text" autocomplete="username" maxlength="254" placeholder="Tu usuario o correo" required>
                <label for="elix-auth-pass">Contraseña</label>
                <input id="elix-auth-pass" type="password" autocomplete="current-password" minlength="6" placeholder="Tu contraseña" required>
                <label class="elix-auth-accept"><input id="elix-auth-terms" type="checkbox" required><span>He leído y acepto el <button type="button" id="elix-auth-legal">Acuerdo de uso, licencia y condiciones</button>.</span></label>
                <div class="elix-auth-remember">La sesión se mantendrá en este dispositivo hasta que cierres sesión o el acceso deje de ser válido.</div>
                <button id="elix-auth-submit" class="elix-auth-primary" type="submit" disabled>Iniciar sesión</button>
                <div id="elix-auth-error" class="elix-auth-error" role="alert" aria-live="polite"></div>
                <div class="elix-auth-copyright">© InOutBio.Os</div>
            </form>
        </div>`;
        document.body.appendChild(o);
        o.querySelector('#elix-auth-legal').onclick=mostrarLegal;
        return o;
    }

    async function iniciarFirebaseAuth(){
        const accountName=document.getElementById('elix-account-name');
        const logoutBtn=document.getElementById('elix-logout-btn');
        const overlay=crearAuthOverlay();
        const form=overlay.querySelector('#elix-auth-form');
        const user=overlay.querySelector('#elix-auth-user');
        const pass=overlay.querySelector('#elix-auth-pass');
        const terms=overlay.querySelector('#elix-auth-terms');
        const submit=overlay.querySelector('#elix-auth-submit');
        const sub=overlay.querySelector('#elix-auth-sub');
        const errorBox=overlay.querySelector('#elix-auth-error');

        // El botón solo se habilita después de marcar expresamente el acuerdo.
        const actualizarBoton=()=>{
            submit.disabled=!terms.checked;
        };
        terms.addEventListener('change', actualizarBoton);
        actualizarBoton();

        const bloquearPorConfiguracion=(mensaje)=>{
            overlay.classList.add('open');
            user.disabled=true;
            pass.disabled=true;
            terms.disabled=true;
            submit.disabled=true;
            sub.textContent='El acceso a Elix AI requiere autenticación.';
            errorBox.textContent=mensaje;
        };

        // A diferencia de la versión anterior, si Firebase no está configurado NO se deja pasar a la app.
        if(!firebaseConfigLista()) {
            if(accountName) accountName.textContent='Cuenta: acceso no disponible';
            bloquearPorConfiguracion('El servicio de acceso de Elix AI no está disponible en este momento.');
            console.info('Elix AI bloqueado: falta completar ELIX_FIREBASE_CONFIG.');
            return;
        }
        if(typeof firebase==='undefined') {
            if(accountName) accountName.textContent='Cuenta: acceso no disponible';
            bloquearPorConfiguracion('El servicio de acceso de Elix AI no pudo cargarse. Revisa tu conexión.');
            console.error('No se cargó Firebase desde el CDN.');
            return;
        }

        try {
            if(!firebase.apps.length) firebase.initializeApp(ELIX_FIREBASE_CONFIG);
            const auth=firebase.auth();

            // Persistencia local de Firebase: la sesión continúa en este dispositivo hasta cerrar sesión
            // o hasta que el proveedor invalide la autenticación. Elix AI no almacena la contraseña.
            await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

            const usuarioRecordado=localStorage.getItem(ELIX_LAST_USER_KEY);
            if(usuarioRecordado && !user.value) user.value=usuarioRecordado;

            form.onsubmit=async(e)=>{
                e.preventDefault();
                errorBox.textContent='';

                const credencial=normalizarCredencial(user.value);
                const password=pass.value;

                if(!validarCredencial(credencial)) {
                    errorBox.textContent='Escribe un usuario válido o el correo registrado.';
                    return;
                }
                if(password.length<6) {
                    errorBox.textContent='La contraseña debe tener al menos 6 caracteres.';
                    return;
                }
                if(!terms.checked) {
                    errorBox.textContent='Debes marcar la casilla y aceptar el acuerdo de uso y licencia antes de iniciar sesión.';
                    actualizarBoton();
                    return;
                }

                submit.disabled=true;
                submit.textContent='Validando...';
                localStorage.removeItem(ELIX_LICENSE_PENDING_KEY);

                try {
                    // Marcador temporal para que onAuthStateChanged pueda asociar la aceptación al UID
                    // incluso si el evento de autenticación llega antes de resolverse la promesa.
                    localStorage.setItem(ELIX_LICENSE_PENDING_KEY, ELIX_LICENSE_VERSION);
                    localStorage.setItem(ELIX_LAST_USER_KEY, credencial);
                    const authResult=await auth.signInWithEmailAndPassword(credencialAEmail(credencial), password);
                    if(authResult?.user?.uid) elixGuardarLicencia(authResult.user.uid);
                    localStorage.removeItem(ELIX_LICENSE_PENDING_KEY);
                } catch(err) {
                    localStorage.removeItem(ELIX_LICENSE_PENDING_KEY);
                    const code=String(err?.code||'');
                    const friendly = code.includes('wrong-password') || code.includes('invalid-credential') || code.includes('user-not-found') || code.includes('invalid-login-credentials')
                        ? 'Usuario o contraseña incorrectos.'
                        : code.includes('user-disabled')
                            ? 'Esta cuenta está deshabilitada.'
                            : code.includes('too-many-requests')
                                ? 'Demasiados intentos. Intenta nuevamente más tarde.'
                                : code.includes('network-request-failed')
                                    ? 'No se pudo conectar con el servicio de acceso. Revisa tu conexión.'
                                    : (err?.message || 'No se pudo iniciar sesión.');
                    errorBox.textContent=friendly;
                } finally {
                    submit.textContent='Iniciar sesión';
                    actualizarBoton();
                }
            };

            auth.onAuthStateChanged(async currentUser=>{
                if(currentUser) {
                    // La aceptación se guarda por usuario y por versión del acuerdo.
                    // Si el usuario acaba de autenticarse con la casilla marcada, se vincula ahora a su UID.
                    const pendiente=localStorage.getItem(ELIX_LICENSE_PENDING_KEY)===ELIX_LICENSE_VERSION;
                    if(pendiente){
                        elixGuardarLicencia(currentUser.uid);
                        localStorage.removeItem(ELIX_LICENSE_PENDING_KEY);
                    }
                    const licenciaAceptada=elixLicenciaAceptada(currentUser.uid);
                    if(!licenciaAceptada) {
                        overlay.classList.add('open');
                        terms.checked=false;
                        actualizarBoton();
                        if(accountName) accountName.textContent='Sesión pendiente de aceptación';
                        if(logoutBtn) logoutBtn.style.display='none';
                        try { await auth.signOut(); } catch(_) {}
                        return;
                    }

                    overlay.classList.remove('open');
                    errorBox.textContent='';
                    if(accountName) accountName.textContent=`Usuario: ${nombreUsuarioFirebase(currentUser) || 'autenticado'}`;
                    if(logoutBtn) logoutBtn.style.display='block';
                } else {
                    overlay.classList.add('open');
                    if(accountName) accountName.textContent='Sesión no iniciada';
                    if(logoutBtn) logoutBtn.style.display='none';
                }
            });

            if(logoutBtn) logoutBtn.onclick=async()=>{
                localStorage.removeItem(ELIX_LICENSE_PENDING_KEY);
                terms.checked=false;
                pass.value='';
                actualizarBoton();
                await auth.signOut();
            };
        } catch(e) {
            console.error('Firebase Auth no pudo inicializarse:',e);
            if(accountName) accountName.textContent='Cuenta: acceso no disponible';
            bloquearPorConfiguracion('No se pudo inicializar el servicio de acceso de Elix AI.');
        }
    }

    iniciarFirebaseAuth();
})();
</script>

<script id="elix-audio-module-script">
(function(){
    'use strict';

    // Este módulo es deliberadamente aislado: no reemplaza enviarMensaje(),
    // adjuntos, exportaciones, modelos principales ni autenticación.
    const AUDIO_INPUT_RATE = 16000;
    const MAX_DICTATION_SECONDS = 60;
    const MAX_TRANSLATION_SECONDS = 60;
    // ~96 KiB de Base64 por petición: mantiene cada subida muy por debajo
    // de los límites de tamaño de una Function sin reducir la duración del audio.
    const AUDIO_UPLOAD_CHARS = 96 * 1024;

    let recorder = null;
    let recorderStream = null;
    let recorderChunks = [];
    let recorderTimer = null;
    let recorderStartedAt = 0;
    let dictationBusy = false;
    let translationBusy = false;

    function elixAudioSafeText(value){
        return String(value ?? '').replace(/[&<>'"]/g, ch => ({
            '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
        }[ch]));
    }

    function elixAudioSetLoading(active, text){
        try {
            if (typeof setCargando === 'function') setCargando(active, text || 'Elix AI procesando audio...');
        } catch (_) {}
    }

    function elixAudioToast(message){
        const text = String(message || 'Ocurrió un problema con el audio.');
        try {
            if (typeof agregarMensajeUI === 'function') {
                agregarMensajeUI('assistant', text, null, []);
                return;
            }
        } catch (_) {}
        alert(text);
    }

    function elixAudioFriendlyError(error){
        return String(error?.message || error || 'Error de audio')
            .replace(/Gemini|Google|Netlify/gi, 'Elix AI')
            .replace(/gemini-[\w.-]+/gi, 'Elix AI');
    }

    function elixArrayBufferToBase64(buffer){
        const bytes = new Uint8Array(buffer);
        const chunk = 0x8000;
        let binary = '';
        for(let i=0;i<bytes.length;i+=chunk){
            binary += String.fromCharCode(...bytes.subarray(i, Math.min(bytes.length, i+chunk)));
        }
        return btoa(binary);
    }

    async function elixAudioToPcm16(fileOrBlob, maxSeconds){
        const blob = fileOrBlob instanceof Blob ? fileOrBlob : new Blob([fileOrBlob]);
        const raw = await blob.arrayBuffer();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if(!AudioCtx || !OfflineCtx) throw new Error('Este navegador no permite preparar audio para Elix AI.');

        const ctx = new AudioCtx();
        let decoded;
        try {
            decoded = await ctx.decodeAudioData(raw.slice(0));
        } catch (_) {
            try { await ctx.close(); } catch {}
            throw new Error('No se pudo leer este formato de audio. Prueba con MP3, WAV, M4A, OGG o WebM.');
        }

        const duration = Number(decoded.duration || 0);
        if(!duration || !Number.isFinite(duration)){
            try { await ctx.close(); } catch {}
            throw new Error('El audio no contiene una duración válida.');
        }
        if(duration > maxSeconds + 0.25){
            try { await ctx.close(); } catch {}
            throw new Error(`Este audio dura ${Math.ceil(duration)} s. El límite seguro actual es ${maxSeconds} s.`);
        }

        const frames = Math.max(1, Math.ceil(duration * AUDIO_INPUT_RATE));
        const offline = new OfflineCtx(1, frames, AUDIO_INPUT_RATE);
        const source = offline.createBufferSource();
        source.buffer = decoded;
        source.connect(offline.destination);
        source.start(0);
        const rendered = await offline.startRendering();
        try { await ctx.close(); } catch {}

        const floats = rendered.getChannelData(0);
        const pcm = new Int16Array(floats.length);
        for(let i=0;i<floats.length;i++){
            const s = Math.max(-1, Math.min(1, floats[i]));
            pcm[i] = s < 0 ? Math.round(s * 0x8000) : Math.round(s * 0x7fff);
        }

        return {
            audio_base64: elixArrayBufferToBase64(pcm.buffer),
            duration: rendered.duration,
            mime_type: `audio/pcm;rate=${AUDIO_INPUT_RATE}`
        };
    }

    function elixAudioTransferId(){
        const uuid = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
            ? globalThis.crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
        return `elixaudio-${uuid}`.replace(/[^a-zA-Z0-9_-]/g,'');
    }

    async function elixUploadAudioForTranslation(audioBase64){
        const b64 = String(audioBase64 || '');
        if(!b64) throw new Error('El audio preparado está vacío.');
        if(typeof window.elixBackend !== 'function') throw new Error('Elix AI no pudo iniciar la subida segura del audio.');

        const transferId = elixAudioTransferId();
        const totalChunks = Math.max(1, Math.ceil(b64.length / AUDIO_UPLOAD_CHARS));

        try{
            for(let index=0; index<totalChunks; index++){
                const start = index * AUDIO_UPLOAD_CHARS;
                const chunk = b64.slice(start, start + AUDIO_UPLOAD_CHARS);
                elixAudioSetLoading(true,`📤 Elix AI preparando audio · ${index + 1}/${totalChunks}`);
                await window.elixBackend('elix-audio-upload-chunk',{
                    transfer_id: transferId,
                    index,
                    total_chunks: totalChunks,
                    chunk
                });
            }
            return { transfer_id: transferId, total_chunks: totalChunks };
        }catch(error){
            try{
                await window.elixBackend('elix-audio-upload-chunk',{
                    action:'cleanup',
                    transfer_id: transferId,
                    total_chunks: totalChunks
                });
            }catch(_){ }
            throw error;
        }
    }

    async function elixCleanupAudioTransfer(transfer){
        if(!transfer?.transfer_id || !transfer?.total_chunks || typeof window.elixBackend !== 'function') return;
        try{
            await window.elixBackend('elix-audio-upload-chunk',{
                action:'cleanup',
                transfer_id: transfer.transfer_id,
                total_chunks: transfer.total_chunks
            });
        }catch(_){ }
    }

    function elixInsertTextAtCursor(text){
        const input = document.getElementById('user-input');
        if(!input) return;
        const value = String(text || '').trim();
        if(!value) return;

        const start = Number.isInteger(input.selectionStart) ? input.selectionStart : input.value.length;
        const end = Number.isInteger(input.selectionEnd) ? input.selectionEnd : input.value.length;
        const before = input.value.slice(0,start);
        const after = input.value.slice(end);
        const spacerBefore = before && !/\s$/.test(before) ? ' ' : '';
        const spacerAfter = after && !/^\s/.test(after) ? ' ' : '';
        input.value = before + spacerBefore + value + spacerAfter + after;
        const pos = (before + spacerBefore + value).length;
        input.focus();
        input.setSelectionRange(pos,pos);
        try { autoResize(input); } catch (_) {}
        input.dispatchEvent(new Event('input',{bubbles:true}));
    }

    async function elixTranscribeBlob(blob){
        const prepared = await elixAudioToPcm16(blob, MAX_DICTATION_SECONDS);
        const result = await window.elixBackground('elix-audio-transcribe', {
            audio_base64: prepared.audio_base64,
            mime_type: prepared.mime_type
        }, {
            etiqueta: '🎙️ Elix AI transcribiendo tu voz',
            maxWaitMs: 4 * 60 * 1000
        });

        const text = String(result?.text || '').trim();
        if(!text) throw new Error('Elix AI no devolvió una transcripción.');
        elixInsertTextAtCursor(text);
        return text;
    }

    async function elixStartDictation(button){
        if(dictationBusy) return;
        if(recorder && recorder.state === 'recording'){
            recorder.stop();
            return;
        }
        if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined'){
            elixAudioToast('Tu navegador no permite grabación de voz desde esta página.');
            return;
        }

        try{
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            recorderStream = stream;
            recorderChunks = [];

            const preferred = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/mp4'
            ].find(type => {
                try { return MediaRecorder.isTypeSupported(type); } catch { return false; }
            });

            recorder = preferred ? new MediaRecorder(stream,{mimeType:preferred}) : new MediaRecorder(stream);
            recorder.ondataavailable = e => {
                if(e.data && e.data.size) recorderChunks.push(e.data);
            };
            recorder.onerror = () => {
                try { recorder.stop(); } catch {}
            };
            recorder.onstop = async () => {
                clearTimeout(recorderTimer);
                recorderTimer = null;
                button.classList.remove('elix-recording');
                button.title = 'Hablar y convertir voz en texto';
                try { recorderStream?.getTracks()?.forEach(t=>t.stop()); } catch {}
                recorderStream = null;

                const mime = recorder?.mimeType || recorderChunks?.[0]?.type || 'audio/webm';
                const blob = new Blob(recorderChunks,{type:mime});
                recorderChunks = [];
                recorder = null;

                if(!blob.size) return;
                dictationBusy = true;
                button.disabled = true;
                elixAudioSetLoading(true,'🎙️ Elix AI transcribiendo tu voz...');
                try{
                    await elixTranscribeBlob(blob);
                }catch(error){
                    console.error('Elix AI · dictado:',error);
                    elixAudioToast(`No se pudo transcribir el audio.\n\n${elixAudioFriendlyError(error)}`);
                }finally{
                    dictationBusy = false;
                    button.disabled = false;
                    elixAudioSetLoading(false);
                }
            };

            recorder.start(500);
            recorderStartedAt = Date.now();
            button.classList.add('elix-recording');
            button.title = 'Detener dictado';
            recorderTimer = setTimeout(() => {
                try {
                    if(recorder?.state === 'recording') recorder.stop();
                } catch {}
            }, MAX_DICTATION_SECONDS * 1000);
        }catch(error){
            console.error('Elix AI · micrófono:',error);
            elixAudioToast('No se pudo acceder al micrófono. Revisa el permiso del navegador para este sitio.');
        }
    }

    const LANGUAGES = [
        ['Español','es'], ['English','en'], ['Français','fr'], ['Deutsch','de'],
        ['Italiano','it'], ['Português','pt'], ['中文','zh'], ['日本語','ja'],
        ['한국어','ko'], ['العربية','ar'], ['Русский','ru'], ['हिन्दी','hi'],
        ['Nederlands','nl'], ['Polski','pl'], ['Türkçe','tr'], ['Bahasa Indonesia','id'],
        ['Українська','uk'], ['Tiếng Việt','vi']
    ];

    function elixOpenTranslateModal(){
        document.querySelector('.elix-audio-modal')?.remove();

        const modal = document.createElement('div');
        modal.className = 'elix-audio-modal';
        modal.innerHTML = `
            <div class="elix-audio-panel" role="dialog" aria-modal="true" aria-labelledby="elix-audio-title">
                <h3 id="elix-audio-title">Traducir audio con Elix AI</h3>
                <p>Selecciona un audio y el idioma al que quieres escucharlo traducido.</p>
                <div class="elix-audio-field">
                    <label for="elix-audio-file">Audio</label>
                    <input id="elix-audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.webm,.flac">
                    <div class="elix-audio-helper">Límite seguro actual: ${MAX_TRANSLATION_SECONDS} segundos por audio.</div>
                </div>
                <div class="elix-audio-field">
                    <label for="elix-audio-language">Idioma de destino</label>
                    <select id="elix-audio-language">
                        ${LANGUAGES.map(([label,code])=>`<option value="${elixAudioSafeText(label)}" data-code="${code}">${elixAudioSafeText(label)}</option>`).join('')}
                        <option value="__custom__">Otro idioma…</option>
                    </select>
                    <input id="elix-audio-language-custom" type="text" maxlength="80" placeholder="Escribe el idioma de destino" style="display:none;margin-top:8px;">
                </div>
                <div class="elix-audio-actions">
                    <button type="button" class="elix-audio-action" data-audio-cancel>Cancelar</button>
                    <button type="button" class="elix-audio-action primary" data-audio-translate>Traducir audio</button>
                </div>
            </div>`;

        document.body.appendChild(modal);
        const cancel = modal.querySelector('[data-audio-cancel]');
        const translate = modal.querySelector('[data-audio-translate]');
        const languageSelect = modal.querySelector('#elix-audio-language');
        const customLanguage = modal.querySelector('#elix-audio-language-custom');
        languageSelect.onchange = () => {
            customLanguage.style.display = languageSelect.value === '__custom__' ? 'block' : 'none';
            if(languageSelect.value === '__custom__') customLanguage.focus();
        };
        cancel.onclick = () => !translationBusy && modal.remove();
        modal.addEventListener('click',e=>{ if(e.target===modal && !translationBusy) modal.remove(); });
        translate.onclick = () => elixTranslateSelectedAudio(modal,translate,cancel);
    }

    function elixBase64ToBlobUrl(base64,mime){
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes],{type:mime || 'audio/wav'});
        return { blob, url: URL.createObjectURL(blob) };
    }

    function elixRenderTranslatedAudio(result,sourceName,targetLanguage){
        const mime = String(result?.mime_type || 'audio/wav');
        let sourceUrl = String(result?.audio_url || '').trim();
        let objectUrl = '';

        // Compatibilidad con resultados antiguos que todavía devolvían Base64.
        if(!sourceUrl){
            const b64 = String(result?.audio_base64 || '');
            if(!b64) throw new Error('Elix AI no devolvió el audio traducido.');
            const converted = elixBase64ToBlobUrl(b64,mime);
            objectUrl = converted.url;
            sourceUrl = objectUrl;
        }

        const chat = document.getElementById('chat-history');
        if(!chat) return;

        const row = document.createElement('div');
        row.className = 'message-row ai';
        const safeTarget = elixAudioSafeText(targetLanguage);
        const safeName = elixAudioSafeText(sourceName || 'audio');
        const safeSource = elixAudioSafeText(sourceUrl);
        const extension = /wav/i.test(mime) ? 'wav' : (/mpeg|mp3/i.test(mime) ? 'mp3' : 'audio');
        row.innerHTML = `
            <div class="avatar avatar-ai">E</div>
            <div class="message-content">
                <div><strong>Audio traducido a ${safeTarget}</strong></div>
                <div class="elix-audio-result">
                    <div style="color:#a1a1aa;font-size:.8rem;">${safeName}</div>
                    <audio controls preload="metadata" src="${safeSource}"></audio>
                    <br>
                    <a class="elix-audio-download" href="${safeSource}" download="Elix-AI-audio-traducido.${extension}">Descargar audio traducido</a>
                </div>
            </div>`;
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;

        // Los blob: antiguos se liberan cuando el elemento se descarte.
        // Las nuevas traducciones usan una URL interna de Elix y no necesitan Base64 en el chat.
        if(objectUrl){
            row.dataset.elixAudioObjectUrl = objectUrl;
        }
    }

    async function elixTranslateSelectedAudio(modal,translateButton,cancelButton){
        if(translationBusy) return;
        const file = modal.querySelector('#elix-audio-file')?.files?.[0];
        const languageSelect = modal.querySelector('#elix-audio-language');
        const customLanguage = modal.querySelector('#elix-audio-language-custom');
        let target = String(languageSelect?.value || '').trim();
        if(target === '__custom__') target = String(customLanguage?.value || '').trim();

        if(!file){
            alert('Selecciona un archivo de audio.');
            return;
        }
        if(!target){
            alert('Selecciona el idioma de destino.');
            return;
        }

        translationBusy = true;
        translateButton.disabled = true;
        cancelButton.disabled = true;
        elixAudioSetLoading(true,`🌐 Elix AI traduciendo audio a ${target}...`);

        let transfer = null;
        try{
            const prepared = await elixAudioToPcm16(file,MAX_TRANSLATION_SECONDS);
            transfer = await elixUploadAudioForTranslation(prepared.audio_base64);

            const result = await window.elixBackground('elix-audio-translate',{
                audio_transfer_id: transfer.transfer_id,
                audio_chunks: transfer.total_chunks,
                mime_type: prepared.mime_type,
                target_language: target
            },{
                etiqueta:`🌐 Elix AI traduciendo audio a ${target}`,
                maxWaitMs: 5 * 60 * 1000
            });

            // La Background Function elimina los fragmentos de entrada al terminar.
            transfer = null;
            modal.remove();
            elixRenderTranslatedAudio(result,file.name,target);
        }catch(error){
            await elixCleanupAudioTransfer(transfer);
            console.error('Elix AI · traducción de audio:',error);
            alert(`No se pudo traducir el audio.\n\n${elixAudioFriendlyError(error)}`);
        }finally{
            translationBusy = false;
            translateButton.disabled = false;
            cancelButton.disabled = false;
            elixAudioSetLoading(false);
        }
    }

    function elixInstallAudioUi(){
        if(document.getElementById('elix-voice-dictation-btn')) return;
        const composer = document.querySelector('.textarea-container');
        const send = document.getElementById('btn-send');
        const attach = composer?.querySelector('button[title*="Adjuntar"]');
        if(!composer || !send) return;

        const translateBtn = document.createElement('button');
        translateBtn.type = 'button';
        translateBtn.id = 'elix-audio-translate-btn';
        translateBtn.className = 'btn-icon elix-audio-btn';
        translateBtn.title = 'Traducir un audio a otro idioma';
        translateBtn.setAttribute('aria-label','Traducir audio');
        translateBtn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17A15.66 15.66 0 0 1 9 11.35 15.59 15.59 0 0 1 6.91 8h-2a17.5 17.5 0 0 0 2.76 4.58L2.58 17.59 4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7 1.62-4.33L19.12 17h-3.24z"/></svg>`;
        translateBtn.onclick = elixOpenTranslateModal;

        const micBtn = document.createElement('button');
        micBtn.type = 'button';
        micBtn.id = 'elix-voice-dictation-btn';
        micBtn.className = 'btn-icon elix-audio-btn';
        micBtn.title = 'Hablar y convertir voz en texto';
        micBtn.setAttribute('aria-label','Dictado por voz');
        micBtn.textContent = '🎙️';
        micBtn.onclick = () => elixStartDictation(micBtn);

        if(attach?.nextSibling) composer.insertBefore(translateBtn,attach.nextSibling);
        else composer.insertBefore(translateBtn,send);
        composer.insertBefore(micBtn,send);
    }

    if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded',elixInstallAudioUi,{once:true});
    }else{
        elixInstallAudioUi();
    }
})();
</script>
